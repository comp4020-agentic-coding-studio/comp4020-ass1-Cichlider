<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Desktop Computer — Exploded View</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <h1 class="sr-only">Desktop Computer — Exploded View</h1>

    <div id="app">
      <div
        id="scene"
        data-testid="scene"
        role="img"
        aria-label="Interactive 3D exploded view of a desktop computer, drag to rotate"
      ></div>

      <header class="hud">
        <p class="hud-tag">DESKTOP COMPUTER · EXPLODED VIEW</p>
        <button type="button" id="explode-toggle" data-testid="explode-trigger" aria-pressed="false">
          Explore Inside
        </button>
      </header>

      <div class="hover-label" id="hover-label" aria-hidden="true"></div>
      <div class="queue-labels" id="queue-labels" aria-hidden="true"></div>

      <nav class="kbd-parts" id="kbd-parts" aria-label="Select a part by name (keyboard accessible)"></nav>

      <aside
        class="detail-panel"
        id="detail-panel"
        data-testid="part-info"
        role="dialog"
        aria-modal="false"
        aria-label="Part details"
        aria-hidden="true"
        inert
        tabindex="-1"
      >
        <button
          type="button"
          class="panel-close"
          id="panel-close"
          aria-label="Back to overview, camera pulls back to show the full parts queue"
        >
          Back to Overview
        </button>
        <p class="panel-index" id="panel-index"></p>
        <h2 id="panel-name"></h2>
        <p class="panel-abbr" id="panel-abbr"></p>
        <p class="panel-def" id="panel-def"></p>
        <p class="panel-explain" id="panel-explain"></p>
        <dl class="panel-facts">
          <div>
            <dt>Responsibility</dt>
            <dd id="panel-responsibility"></dd>
          </div>
          <div>
            <dt>Why it matters</dt>
            <dd id="panel-importance"></dd>
          </div>
          <div>
            <dt>Typical spec</dt>
            <dd id="panel-spec"></dd>
          </div>
        </dl>
        <div class="panel-nav">
          <button type="button" id="panel-prev">Previous Part</button>
          <button type="button" id="panel-next">Next Part</button>
        </div>
      </aside>

      <p class="empty-state" id="empty-state">Select Explore Inside, or click the computer to begin.</p>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
