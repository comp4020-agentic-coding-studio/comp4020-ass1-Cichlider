<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seven simple objects</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <nav aria-label="Primary">
        <a href="./">Home</a>
      </nav>
    </header>
    <main>
      <h1>It's just seven simple objects</h1>
      <p class="intro">
        A computer looks like one sealed, mysterious box. Pull it apart and it's really
        only seven physical objects, each doing one job none of the others can do. Click
        <strong>Explode</strong>, then click a part to find out what it is.
      </p>
      <div class="viewer">
        <div id="scene" data-testid="scene" role="img" aria-label="3D exploded view of a desktop computer"></div>
        <button type="button" id="explode-toggle" data-testid="explode-trigger" aria-pressed="false">
          Explode
        </button>
        <aside data-testid="part-info" aria-live="polite">
          <p class="placeholder">Click a part to learn what it does.</p>
        </aside>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
